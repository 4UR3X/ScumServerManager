<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LGSS SCUM Server Status Widget</title>
  <link rel="stylesheet" href="./lgss-tactical-tokens.css" />
</head>
<body style="background:#07080b; display:flex; justify-content:center; padding:40px;">
  <article class="lgss-status-card" id="lgss-widget" data-endpoint="http://127.0.0.1:8001/api/health">
    <header class="lgss-status-card__header">
      <div>
        <div style="font-size:10px; letter-spacing:0.22em; color:#f97316; font-weight:800;">LEGENDARY GAMING</div>
        <h2 class="lgss-status-card__title">LGSS SCUM Server Node</h2>
      </div>
      <span id="lgss-state-pill" class="lgss-badge lgss-badge--offline">Checking...</span>
    </header>
    <section class="lgss-telemetry-grid">
      <div class="lgss-telemetry-cell">
        <div style="color:#a1a1aa; font-size:10px;">MANAGER</div>
        <strong id="lgss-ver">v1.3.35</strong>
      </div>
      <div class="lgss-telemetry-cell">
        <div style="color:#a1a1aa; font-size:10px;">RCON ENGINE</div>
        <strong>Source TCP</strong>
      </div>
      <div class="lgss-telemetry-cell">
        <div style="color:#a1a1aa; font-size:10px;">PLATFORM</div>
        <strong>Win x64</strong>
      </div>
    </section>
  </article>
  <script>
    (async function pollStatus() {
      const root = document.getElementById("lgss-widget");
      const pill = document.getElementById("lgss-state-pill");
      const ver = document.getElementById("lgss-ver");
      try {
        const res = await fetch(root.dataset.endpoint, { cache: "no-store" });
        const data = await res.json();
        if (data && data.status === "ok") {
          pill.className = "lgss-badge lgss-badge--online";
          pill.textContent = "Online";
          ver.textContent = "v" + (data.version || "1.3.35");
        }
      } catch (_err) {
        pill.className = "lgss-badge lgss-badge--offline";
        pill.textContent = "Offline";
      }
    })();
  </script>
</body>
</html>
